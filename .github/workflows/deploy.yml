name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  WEB_PROJECT: src/JurisControl.Web/JurisControl.Web.csproj
  PUBLISH_DIR: publish

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity minimal

      - name: Publish
        run: dotnet publish ${{ env.WEB_PROJECT }} --configuration Release --no-build --output ${{ env.PUBLISH_DIR }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-publish
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-publish
          path: publish

      # Force IIS to recycle by touching web.config after the sync.
      # SmartASP.NET picks up the new binaries when web.config timestamp changes.
      - name: Deploy via FTP to SmartASP.NET
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SMARTASP_FTP_SERVER }}
          username: ${{ secrets.SMARTASP_FTP_USERNAME }}
          password: ${{ secrets.SMARTASP_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /juriscontrol/
          protocol: ftp
          port: 21
          state-name: .ftp-deploy-sync-state.json
          log-level: standard
          dangerous-clean-slate: false

# Secrets requeridos (Settings → Secrets and variables → Actions):
#   SMARTASP_FTP_SERVER      win8153.site4now.net           (sin protocolo, sin puerto)
#   SMARTASP_FTP_USERNAME    rafacorona-001
#   SMARTASP_FTP_PASSWORD    (password del panel / FTP)
#
# El destino remoto es /juriscontrol/ que corresponde a la raíz del sitio en
# SmartASP.NET (según el publishUrl del .PublishSettings: ftp://.../juriscontrol).
#
# La primera corrida sube todos los archivos publish (varios cientos de MB).
# Las siguientes solo suben las diferencias gracias a state-name (sync incremental).
#
# Environment Variables del sitio (panel de SmartASP.NET, sección del sitio JurisControl):
#   ConnectionStrings__DefaultConnection =
#     Server=sql8006.site4now.net;
#     Database=db_a81e28_juriscontrol35;
#     User Id=db_a81e28_juriscontrol35_admin;
#     Password=<contrasena SQL>;
#     TrustServerCertificate=True;
#     MultipleActiveResultSets=true
