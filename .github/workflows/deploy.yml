name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  WEB_PROJECT: src/JurisControl.Web/JurisControl.Web.csproj
  PUBLISH_DIR: publish

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity minimal

      # SmartASP.NET no propaga las Environment Variables del panel al proceso
      # dotnet que corre en IIS. Inyectamos la connection string en un
      # appsettings.Production.json generado durante el build; ASP.NET Core lo
      # lee automáticamente cuando ASPNETCORE_ENVIRONMENT=Production.
      - name: Inject production configuration
        shell: pwsh
        run: |
          $config = @{
            ConnectionStrings = @{
              DefaultConnection = "${{ secrets.SQL_CONNECTION_STRING }}"
            }
          } | ConvertTo-Json -Depth 5
          $config | Out-File -FilePath "src/JurisControl.Web/appsettings.Production.json" -Encoding utf8
          Write-Host "appsettings.Production.json creado (${{ secrets.SQL_CONNECTION_STRING == '' && 'VACÍO — falta configurar SQL_CONNECTION_STRING secret' || 'con connection string' }})."

      - name: Publish
        run: dotnet publish ${{ env.WEB_PROJECT }} --configuration Release --no-build --output ${{ env.PUBLISH_DIR }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-publish
          path: ${{ env.PUBLISH_DIR }}
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: production
    env:
      FTP_HOST:  ${{ secrets.SMARTASP_FTP_SERVER }}
      FTP_USER:  ${{ secrets.SMARTASP_FTP_USERNAME }}
      FTP_PASS:  ${{ secrets.SMARTASP_FTP_PASSWORD }}
      FTP_ROOT:  /juris
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-publish
          path: publish

      # 1) Sube app_offline.htm — IIS detecta el archivo, apaga la app y libera los file locks
      #    de los .dll para que el FTP pueda sobrescribirlos.
      - name: Take app offline
        run: |
          set -e
          cat > app_offline.htm <<'HTML'
          <!DOCTYPE html>
          <html lang="es"><head><meta charset="utf-8"><title>Actualizando…</title>
          <style>body{font-family:-apple-system,Segoe UI,sans-serif;background:#f4f2ee;color:#222;display:grid;place-items:center;min-height:100vh;margin:0}
          .card{background:#fff;padding:32px 40px;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
          h1{margin:0 0 8px;color:#0a66c2}p{color:#666;margin:0}</style></head>
          <body><div class="card"><h1>Actualizando JurisControl…</h1><p>Vuelve en unos segundos.</p></div></body></html>
          HTML
          echo "Uploading app_offline.htm to release IIS locks..."
          curl --fail --show-error --silent \
               --user "$FTP_USER:$FTP_PASS" \
               -T app_offline.htm \
               "ftp://$FTP_HOST$FTP_ROOT/app_offline.htm"
          echo "Waiting 10 seconds for IIS to release file handles..."
          sleep 10

      # 2) Sube el nuevo publish al servidor. Excluye el propio app_offline.htm
      #    para no borrarlo mientras se hace el sync (todavía lo necesitamos).
      - name: Deploy binaries via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SMARTASP_FTP_SERVER }}
          username: ${{ secrets.SMARTASP_FTP_USERNAME }}
          password: ${{ secrets.SMARTASP_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /juris/
          protocol: ftp
          port: 21
          state-name: .ftp-deploy-sync-state.json
          log-level: standard
          dangerous-clean-slate: false
          exclude: |
            **/app_offline.htm
            **/.ftp-deploy-sync-state.json

      # 3) Borra app_offline.htm — IIS ve que el archivo desapareció y reinicia la app
      #    con los binarios nuevos. Este paso corre siempre para evitar dejar el sitio
      #    caído si el deploy falla parcialmente.
      - name: Bring app back online
        if: always()
        run: |
          echo "Removing app_offline.htm to restart IIS app pool..."
          curl --show-error --silent \
               --user "$FTP_USER:$FTP_PASS" \
               -Q "DELE $FTP_ROOT/app_offline.htm" \
               "ftp://$FTP_HOST/" || true
          echo "Done."

# Secrets requeridos (Settings → Secrets and variables → Actions):
#   SMARTASP_FTP_SERVER      win8153.site4now.net           (sin protocolo, sin puerto)
#   SMARTASP_FTP_USERNAME    rafacorona-001
#   SMARTASP_FTP_PASSWORD    (password del panel / FTP)
#   SQL_CONNECTION_STRING    Server=sql8006.site4now.net;Database=db_a81e28_juriscontrol35;User Id=db_a81e28_juriscontrol35_admin;Password=<pass>;TrustServerCertificate=True;MultipleActiveResultSets=true
#
# Nota: la connection string se inyecta durante el build en appsettings.Production.json
# porque SmartASP.NET no propaga las Environment Variables del panel al proceso .NET
# hosted en IIS. El appsettings.Production.json queda incluido en el artifact publish
# y se sube por FTP como un archivo más.
